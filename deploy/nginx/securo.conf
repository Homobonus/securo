# /etc/nginx/sites-available/securo.conf
# Replace securo.example.com with your domain. Certificates come from
# certbot in standalone mode (see deploy/README.md), at certbot's default paths.

server {
    listen 80;
    listen [::]:80;
    server_name securo.example.com;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` works on every nginx in current Ubuntu/Debian;
    # from nginx 1.25 it warns and prefers a separate `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name securo.example.com;

    ssl_certificate     /etc/letsencrypt/live/securo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/securo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Uploads (statements, attachments) pass through here. The frontend
    # container's own nginx keeps its default 1 MB cap behind this, so
    # raising this alone does not allow bigger files.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Securo counts this hop (TRUSTED_PROXY_HOPS=2) to find the visitor's IP.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A manual receipt or bank sync can run for about a minute.
        proxy_read_timeout 180s;
    }
}
